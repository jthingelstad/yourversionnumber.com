<script>
// Privacy: tinylytics' embed sends window.location.href (the full URL, with any
// ?p= dates in the query string) and the full referrer to its collector.
// sanitizeCollectorUrl reduces both to origin + path before the request fires:
// analytics still records which page was viewed and where the visitor came
// from, while the dates in the query string never leave the browser.
(function () {
  function pathOnly(value) {
    try {
      var parsed = new URL(value, location.origin);
      return parsed.origin + parsed.pathname;
    } catch (e) {
      return '';
    }
  }
  function sanitizeCollectorUrl(input) {
    var u = new URL(input, location.origin);
    ['url', 'referrer'].forEach(function (key) {
      var raw = u.searchParams.get(key);
      // An absent or empty referrer means "direct". Leave it alone rather than
      // resolving '' against location and inventing a self-referral.
      if (!raw) return;
      var safe = pathOnly(raw);
      if (safe) u.searchParams.set(key, safe);
      else u.searchParams.delete(key);
    });
    return u.toString();
  }
  var origFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    try {
      if (typeof input === 'string' && input.indexOf('tinylytics.app/collector/') !== -1) {
        input = sanitizeCollectorUrl(input);
      }
    } catch (e) { /* leave fetch input as-is */ }
    return origFetch(input, init);
  };
})();
</script>

<main id="app">
  <!-- Static first paint. Gives crawlers and no-JS visitors real content; app.js
       clears #app and re-renders the live version on load. -->
  <header class="site-header">
    <h1 class="site-title">Your Version Number</h1>
  </header>
  <p class="intro">A person’s version number is their age in <code>MAJOR.MINOR.PATCH</code> &mdash; decade, year-in-decade, days since their last birthday. Add a birthday to begin.</p>
  <noscript>
    <p class="intro">This page needs JavaScript to do the date math. All of it runs in your browser: there is no server and no database, and birthdays live only in the URL.</p>
    <p class="intro">To work one out by hand: <code>MAJOR</code> is the decade of your age, <code>MINOR</code> is the year within that decade, and <code>PATCH</code> is the number of days since your last birthday. Someone aged 52 years and 113 days is <code>5.2.113</code>. The day you turn 53, you ship <code>5.3.0</code>.</p>
    <p class="intro">A sibling page, <a href="/work/">Your Version Number: Work Edition</a>, applies the same idea to a job: years of tenure, quarter within the tenure year, and business days into that quarter.</p>
  </noscript>
</main>
