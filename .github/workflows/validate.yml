name: Validate site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: node --check birthday/assets/app.js && node --check work/assets/app.js && node --check assets/gallery.js
      - name: Validate site assets and privacy guards
        run: node .github/scripts/validate-site.mjs
