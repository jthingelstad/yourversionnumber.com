name: Deploy

# Publishes the static site to S3 and invalidates CloudFront. Runs only after
# the validator passes, so a broken theme never reaches production.
on:
  workflow_run:
    workflows: ["Validate site"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# OIDC: GitHub hands AWS a short-lived token and assumes a role. There are no
# long-lived keys in this repo and there should never be.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::999153317627:role/yvn-deploy
          aws-region: us-east-1

      # The bucket holds exactly what the repo ships and nothing else, so
      # --delete is safe: anything not in this checkout is not part of the site.
      - name: Sync to S3
        run: |
          aws s3 sync . s3://yourversionnumber-com-site/ \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "design_handoff_theme_refresh/*" \
            --exclude "*.md" \
            --exclude "*.mjs" \
            --exclude "*.sh" \
            --exclude ".gitignore" \
            --exclude "CNAME" \
            --exclude "themes-preview.html" \
            --exclude "_*.html" \
            --delete --only-show-errors

      - name: Set HTML cache headers
        run: |
          aws s3 cp s3://yourversionnumber-com-site/ s3://yourversionnumber-com-site/ \
            --recursive --exclude "*" --include "*.html" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=300" \
            --content-type "text/html; charset=utf-8" --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EXHEH2YDGRSWL --paths "/*" \
            --query "Invalidation.Id" --output text
