<script>
// Analytics privacy shim, v2. Inlined in every page, byte-identical; CI diffs
// them. It sits in front of the tinylytics embed and does three things to
// every collector request before it leaves the browser:
//
// 1. Never sends from a frame (previews are real edition pages) or from any
//    host but yourversionnumber.com (local checkouts, QA harnesses).
// 2. Replaces the page URL with a VIRTUAL PATH that carries what we want to
//    read and nothing a person typed: /birthday/<theme>/, /work/edition/<theme>/,
//    /card/<edition>/<theme>/. Names, dates, notes and senders in ?p= ?j=
//    ?card= ?note= ?from= never leave. The theme slug is validated.
// 3. Reduces the referrer to origin + path.
//
// Wraps fetch AND sendBeacon: the embed uses fetch today, and would switch to
// a beacon for ?beacon / ?auto, which CI therefore refuses.
(function () {
  var SITE = 'yourversionnumber.com';
  var COLLECTOR = 'https://tinylytics.app/collector/8JZbs4z3jyWQay28S2av';
  var SLUG = /^[a-z0-9-]{1,32}$/;
  var VPATH = /^\/[a-z0-9\/-]+\/$/;
  var framed;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  var allowed = location.hostname === SITE && !framed;

  function virtualPath() {
    var path = location.pathname;
    var edition = path === '/birthday/' ? 'birthday' : path === '/work/edition/' ? 'work' : null;
    if (!edition) return path;
    var q = new URLSearchParams(location.search);
    var theme = q.get('theme');
    if (!theme || !SLUG.test(theme)) {
      theme = document.documentElement.getAttribute('data-analytics-default') || 'default';
    }
    if (q.has('card')) return '/card/' + edition + '/' + theme + '/';
    return path + theme + '/';
  }
  function pathOnly(value) {
    try {
      var parsed = new URL(value, location.origin);
      return parsed.origin + parsed.pathname;
    } catch (e) {
      return '';
    }
  }
  function sanitizeCollectorUrl(input) {
    var u = new URL(input, location.origin);
    var vp = virtualPath();
    if (u.searchParams.has('url')) u.searchParams.set('url', location.origin + vp);
    if (u.searchParams.has('path')) u.searchParams.set('path', vp);
    var raw = u.searchParams.get('referrer');
    // An absent or empty referrer means "direct". Leave it alone rather than
    // resolving '' against location and inventing a self-referral.
    if (raw) {
      var safe = pathOnly(raw);
      if (safe) u.searchParams.set('referrer', safe);
      else u.searchParams.delete('referrer');
    }
    return u.toString();
  }
  function isCollector(input) {
    return typeof input === 'string' && input.indexOf('tinylytics.app/collector/') !== -1;
  }
  var origFetch = window.fetch.bind(window);
  var swallow = function () { return Promise.resolve(new Response(null, { status: 204 })); };
  window.fetch = function (input, init) {
    if (isCollector(input)) {
      if (!allowed) return swallow();
      // If the rewrite fails for any reason, the raw request must not go out.
      try { input = sanitizeCollectorUrl(input); } catch (e) { return swallow(); }
    }
    return origFetch(input, init);
  };
  if (navigator.sendBeacon) {
    var origBeacon = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function (url, data) {
      if (isCollector(url)) {
        if (!allowed) return true;
        try { url = sanitizeCollectorUrl(url); } catch (e) { return true; }
      }
      return origBeacon(url, data);
    };
  }
  // A synthetic view for the two card actions, e.g. /card/copied/birthday/departures/.
  // Only ever a slug path; the same guards apply.
  window.yvnTrackPath = function (vp) {
    if (!allowed || !VPATH.test(vp)) return;
    origFetch(COLLECTOR + '?url=' + encodeURIComponent(location.origin + vp) + '&path=' + encodeURIComponent(vp) + '&referrer=', { method: 'post' });
  };
})();
</script>

  <header class="site-header">
    <h1 class="site-title">Your Version Number: Work Edition™</h1>
  </header>
  <p class="intro">It’s the version number you know and love &mdash; now <strong>ENTERPRISE-READY</strong>. The <strong>Work Edition</strong>™ ships with <code>YEARS.QUARTERS.DAYS</code>, where days are <em>business</em> days, because real work doesn’t happen on weekends. Synergize your timeline. Add a role to begin.</p>
  <noscript>
    <p class="intro">This page needs JavaScript to calculate version numbers. Names, dates, themes &mdash; and on a card, the note &mdash; are read from the URL and stored nowhere. <a href="/about/">How links and sharing work</a>.</p>
    <p class="intro">To work one out by hand: <code>YEARS</code> is how long you have been in the job, <code>QUARTERS</code> is which quarter of your current tenure year you are in (1&ndash;4, counted in three-month steps from your start date, not from January), <code>DAYS</code> is the number of business days into that quarter, and after the <code>+</code>, <code>BUILD</code> is every business day ever logged. Someone three years and change into a job is <code>3.2.40+888</code>.</p>
    <p class="intro">For the original, birthday-based version, see <a href="/birthday/">Your Version Number</a>.</p>
  </noscript>
</main>
