<script>
// Privacy: tinylytics' embed sends window.location.href (the full URL, with any
// ?j= dates in the query string) and the full referrer to its collector.
// sanitizeCollectorUrl reduces both to origin + path before the request fires:
// analytics still records which page was viewed and where the visitor came
// from, while the dates in the query string never leave the browser.
(function () {
  function pathOnly(value) {
    try {
      var parsed = new URL(value, location.origin);
      return parsed.origin + parsed.pathname;
    } catch (e) {
      return '';
    }
  }
  function sanitizeCollectorUrl(input) {
    var u = new URL(input, location.origin);
    ['url', 'referrer'].forEach(function (key) {
      var raw = u.searchParams.get(key);
      // An absent or empty referrer means "direct". Leave it alone rather than
      // resolving '' against location and inventing a self-referral.
      if (!raw) return;
      var safe = pathOnly(raw);
      if (safe) u.searchParams.set(key, safe);
      else u.searchParams.delete(key);
    });
    return u.toString();
  }
  var origFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    try {
      if (typeof input === 'string' && input.indexOf('tinylytics.app/collector/') !== -1) {
        input = sanitizeCollectorUrl(input);
      }
    } catch (e) { /* leave fetch input as-is */ }
    return origFetch(input, init);
  };
})();
</script>

    <h1 class="site-title">Your Version Number: Work Edition™</h1>
  </header>
  <p class="intro">It’s the version number you know and love &mdash; now <strong>ENTERPRISE-READY</strong>. The <strong>Work Edition</strong>™ ships with <code>YEARS.QUARTERS.DAYS</code>, where days are <em>business</em> days, because real work doesn’t happen on weekends. Synergize your timeline. Add a role to begin.</p>
  <noscript>
    <p class="intro">This page needs JavaScript to do the date math. All of it runs in your browser: there is no server and no database, and start dates live only in the URL.</p>
    <p class="intro">To work one out by hand: <code>YEARS</code> is how long you have been in the job, <code>QUARTERS</code> is which quarter of your current tenure year you are in (0&ndash;3, counted in three-month steps from your start date, not from January), and <code>DAYS</code> is the number of business days into that quarter. Someone three years and change into a job is <code>3.2.40</code>.</p>
    <p class="intro">For the original, birthday-based version, see <a href="/birthday/">Your Version Number</a>.</p>
  </noscript>
