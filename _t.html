<!DOCTYPE html><html><head><style>
*{box-sizing:border-box}body{margin:0;background:#222;font:11px monospace;color:#bbb;
display:grid;grid-template-columns:repeat(3,440px);gap:6px;padding:6px}
span{display:block;padding:2px}iframe{width:440px;height:900px;border:0}
</style></head><body>
<div><span>vinyl normal (arm tracks patch-pct)</span><iframe src="/birthday/?theme=vinyl&p=Ada:1979-04-12&p=Grace:1991-11-30"></iframe></div>
<div><span>vinyl countdown (arm lifted)</span><iframe src="/birthday/?theme=vinyl&p=Soon:1976-09-14"></iframe></div>
<div><span>vinyl card (B-side)</span><iframe id="c" src="/birthday/?theme=vinyl&p=Sara:1981-03-02"></iframe></div>
<script>c.addEventListener('load',e=>{const d=e.target.contentDocument,a=d.getElementById('app');
const b=d.createElement('div');b.className='card-message';b.dataset.occasion='birthday';
b.innerHTML='<p class="card-recipient">Sara</p><p class="card-note">Four whole decades and still no breaking changes.</p><p class="card-from">Jamie</p>';
a.insertBefore(b,a.querySelector('.site-footer'));});</script></body></html>
