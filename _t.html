<!DOCTYPE html><html><head><style>
*{box-sizing:border-box}body{margin:0;background:#222;font:11px monospace;color:#bbb;
display:grid;grid-template-columns:repeat(4,420px);gap:6px;padding:6px}
span{display:block;padding:2px}iframe{width:420px;height:820px;border:0}
</style></head><body>
<div><span>memphis chrome + re-keyed shapes</span><iframe src="/birthday/?theme=memphis&p=Ada:1979-04-12&p=Grace:1991-11-30&p=Alan:1912-06-23"></iframe></div>
<div><span>memphis countdown squiggles (5d)</span><iframe src="/birthday/?theme=memphis&p=Soon:1976-09-14"></iframe></div>
<div><span>memphis card bubble</span><iframe id="c" src="/birthday/?theme=memphis&p=Sara:1981-03-02"></iframe></div>
<div><span>slidedeck portrait @390 + KPI</span><iframe src="/work/?theme=slidedeck&j=Engineer:2022-03-14" style="width:390px"></iframe></div>
<script>c.addEventListener('load',e=>{const d=e.target.contentDocument,a=d.getElementById('app');
const b=d.createElement('div');b.className='card-message';b.dataset.occasion='birthday';
b.innerHTML='<p class="card-recipient">Sara</p><p class="card-note">Four whole decades and still no breaking changes.</p><p class="card-from">Jamie</p>';
a.insertBefore(b,a.querySelector('.site-footer'));});</script></body></html>
