<!DOCTYPE html><html><head><style>
*{box-sizing:border-box}body{margin:0;background:#222;font:11px monospace;color:#bbb;
display:grid;grid-template-columns:repeat(4,390px);gap:6px;padding:6px}
span{display:block;padding:2px}iframe{width:390px;height:900px;border:0}
</style></head><body>
<div><span>EMPTY birthday — "away being one year older"</span><iframe src="/birthday/?theme=ooo"></iframe></div>
<div><span>EMPTY work — original reason</span><iframe src="/work/?theme=ooo"></iframe></div>
<div><span>fixed sign-offs (variants 5,6)</span><iframe src="/birthday/?theme=ooo&p=Wed:1990-01-05&p=Trek:1988-02-11&p=C:1991-03-03&p=D:1992-04-04&p=E:1993-05-05&p=F:1994-06-06&p=G:1995-07-07&p=H:1996-08-08"></iframe></div>
<div><span>card (forwarded, ordered)</span><iframe id="c" src="/birthday/?theme=ooo&p=Sara:1981-03-02"></iframe></div>
<script>c.addEventListener('load',e=>{const d=e.target.contentDocument,a=d.getElementById('app');
const b=d.createElement('div');b.className='card-message';b.dataset.occasion='birthday';
b.innerHTML='<p class="card-recipient">Sara</p><p class="card-note">Four whole decades and still no breaking changes.</p><p class="card-from">Jamie</p>';
a.insertBefore(b,a.querySelector('.site-footer'));});</script></body></html>
