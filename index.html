<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Version Number</title>
<meta name="description" content="A version number for a person, calculated from their birthday. Inspired by Semantic Versioning.">
<link rel="stylesheet" href="assets/base.css">
<link id="theme-css" rel="stylesheet" href="themes/default.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3Ev%3C/text%3E%3C/svg%3E">
<script defer src="https://tinylytics.app/embed/8JZbs4z3jyWQay28S2av/min.js?events&hits&countries"></script>
</head>
<body>
<main id="app"></main>
<!-- Static slots for Tinylytics widgets. They must exist in the DOM at script load
     time because Tinylytics scans for them once and never re-scans. app.js relocates
     them into the footer on each render. -->
<div id="tly-slots" hidden>
  <span id="hits-span" class="tinylytics_hits" data-path="/">&mdash;</span>
  <span id="countries-span" class="tinylytics_countries"></span>
</div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
